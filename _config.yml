title: Sriram Sankar
url: "https://sriramsankar.in"
baseurl: ""

markdown: kramdown
kramdown:
  input: GFM

collections:
  thoughts:
    output: true
    permalink: /:collection/:path/
  sideprojects:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: "thoughts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "sideprojects"
    values:
      layout: "post"

# Mirrors the old Hugo config.yaml's `Params.social.share` block,
# read by _includes/socialshare.html as site.social.share.*
social:
  share:
    facebook: true
    linkedin: true
    twitter: true
    whatsapp: false
    email: true

plugins:
  - jekyll-sitemap

# Jekyll 4 compiles Sass with Dart Sass. The theme's SCSS predates the Sass
# module system, so silence those deprecation warnings until it is migrated.
sass:
  silence_deprecations:
    - import
    - global-builtin
    - color-functions
    - if-function

# Jekyll skips dot-folders by default; publish the TDM opt-out file.
include:
  - .well-known

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CLAUDE.md
  - vendor
  - node_modules
