{% unless page.url == "/" %}
  <div class="breadcrumb">
    <a href="{{ '/' | relative_url }}">Home</a> &gt;
    {% if page.collection == "thoughts" %}
    <a href="{{ '/thoughts/' | relative_url }}">Thoughts</a> &gt;
    {% elsif page.collection == "sideprojects" %}
    <a href="{{ '/sideprojects/' | relative_url }}">Side Projects</a> &gt;
    {% endif %}
    {{ page.title }}
  </div>
{% endunless %}
