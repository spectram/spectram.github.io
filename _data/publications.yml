highlights:
  - key: sankar2026a
    heading: A physical origin for extended, warped HI discs
    image: /images/sci/hot_accretion_warp.png
    wide: true
    image_alt: Temperature, HI column density and line-of-sight velocity of a simulated galaxy accreting from a tilted hot atmosphere
    summary: >-
      Using analytic calculations and idealised hydrodynamic simulations, I showed that the hot (~10<sup>6</sup> K)
      atmosphere of a spiral galaxy continuously condenses onto a cool (~10<sup>4</sup> K) disc, and that a tilt between
      the atmosphere and the disc produces an extended, warped outer HI disc. A measured warp therefore constrains the
      angular momentum and accretion rate of the hot atmosphere.
  - key: sankar2020
    heading: The multiphase circumgalactic medium in absorption
    image: /images/sci/sankar+20_components.png
    image_alt: Multi-component fits to absorption lines from Sankar et al. 2020
    summary: >-
      Combining HST and Keck spectra across five ionisation stages of oxygen, I derived the density, temperature, and
      metallicity of five absorbers around galaxies at intermediate redshift. The paper is featured in C.W. Churchill's
      <a href="https://www.qsoabslines.org"><em>Quasar Absorption Lines</em></a> textbook as a first detailed view of
      OVI absorbers at z~1.

