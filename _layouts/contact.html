---
layout: default
---

{% include header.html image=page.img_path tagline=page.tagline %}

<div id="content" class="site-content">
  <main id="main" class="site-main inner">

    <article class="post page post-full">
      <header class="post-header">
        <h1 class="post-title">{{ page.title }}</h1>
      </header><!-- .post-header -->
      {% if page.subtitle %}
      <div class="post-subtitle">
        {{ page.subtitle }}
      </div><!-- .post-subtitle -->
      {% endif %}
      <div class="post-content">
        {{ content }}
        <!-- TODO: replace YOUR_FORM_ID with your real Formspree endpoint from https://formspree.io -->
        <form name="{{ page.form_id }}" id="{{ page.form_id }}" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
          <input type="hidden" name="_next" value="{{ '/success/' | absolute_url }}" />
          {% for field in page.form_fields %}
            {% include form_field.html field=field %}
          {% endfor %}
          <div class="form-submit">
            <button type="submit" class="button">{{ page.submit_label }}</button>
          </div>
        </form>
      </div><!-- .post-content -->
    </article><!-- .post -->

  </main><!-- .site-main -->

  {% include footer.html %}

</div><!-- .site-content -->
